<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"><style>.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .35s ease-in-out infinite alternate}@keyframes flame{from{transform:scaleY(.85) scaleX(.95)}to{transform:scaleY(1.12) scaleX(1.05)}}.sp{animation:sp 1.2s ease-out infinite}@keyframes sp{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}.steam{transform-box:fill-box;transform-origin:center;animation:steam 3s ease-out infinite}@keyframes steam{0%{transform:translateY(16px);opacity:0}40%{opacity:.85}100%{transform:translateY(-30px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
