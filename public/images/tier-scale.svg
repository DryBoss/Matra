<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"><style>.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}@keyframes grow{from{transform:scaleY(.75)}to{transform:scaleY(1)}}.arrow{stroke-dasharray:14 12;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-26}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<g fill="#fff" opacity="0.07"><circle cx="1050" cy="110" r="130"/><circle cx="130" cy="500" r="100"/></g>
<rect x="0" y="500" width="1200" height="100" fill="#0c1a4a"/>
