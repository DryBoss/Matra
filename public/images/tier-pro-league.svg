<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"><style>.beams{animation:beams 5s ease-in-out infinite}@keyframes beams{0%,100%{opacity:.8}50%{opacity:1}}.ball{animation:bounce 1.8s cubic-bezier(.3,.0,.4,1) infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}.sh{transform-box:fill-box;transform-origin:center;animation:sh 1.8s cubic-bezier(.3,.0,.4,1) infinite}@keyframes sh{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.7);opacity:.3}}.net{animation:net 4s ease-in-out infinite}@keyframes net{0%,100%{opacity:1}50%{opacity:.7}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0f2f3a"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef9c3" stop-opacity="0.5"/><stop offset="1" stop-color="#fef9c3" stop-opacity="0"/></linearGradient>
<pattern id="net" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H22M0 0V22" stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="1.6" fill="none"/></pattern>
</defs>
<rect width="1200" height="600" fill="url(#sky)"/>
<polygon class="beams" points="90,60 -60,470 330,470" fill="url(#beam)"/>
<polygon class="beams" style="animation-delay:-2s" points="1110,60 870,470 1260,470" fill="url(#beam)"/>
<g fill="#fef9c3"><circle cx="90" cy="56" r="14"/><circle cx="1110" cy="56" r="14"/></g>
<rect x="0" y="470" width="1200" height="26" fill="#15803d"/><rect x="0" y="496" width="1200" height="34" fill="#16a34a"/><rect x="0" y="530" width="1200" height="70" fill="#15803d"/>
<rect x="394" y="226" width="412" height="244" fill="#020617" opacity="0.55"/>
<rect class="net" x="394" y="226" width="412" height="244" fill="url(#net)"/>
<rect x="382" y="212" width="436" height="14" rx="4" fill="#f8fafc"/>
