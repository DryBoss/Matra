<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.steam{transform-box:fill-box;transform-origin:center;animation:steam 3s ease-out infinite}@keyframes steam{0%{transform:translateY(14px);opacity:0}40%{opacity:.85}100%{transform:translateY(-28px);opacity:0}}.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.bulb{animation:bulb 2.4s ease-in-out infinite}@keyframes bulb{0%,100%{opacity:.55}50%{opacity:1}}.scan{animation:scan 2.6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(92px)}}.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 2s ease-in-out infinite alternate}@keyframes flag{from{transform:skewY(-4deg)}to{transform:skewY(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
