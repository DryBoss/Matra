<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><style>.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 6.5s ease-in-out infinite reverse}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}@keyframes pop{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1740"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
</defs>
